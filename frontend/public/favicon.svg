<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0B0B0B" />
      <stop offset="100%" stop-color="#18181B" />
    </linearGradient>
    
    <!-- Accent Gradient (Pulse / Checkmark) -->
    <linearGradient id="accentGrad" x1="0%" y1="100%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#DCCCEC" /> <!-- Pastel Purple -->
      <stop offset="50%" stop-color="#BCD8EC" /> <!-- Pastel Blue -->
      <stop offset="100%" stop-color="#D6E5BD" /> <!-- Pastel Green -->
    </linearGradient>

    <!-- Glassmorphic Glow -->
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="16" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Background Base -->
  <rect width="512" height="512" rx="128" fill="url(#bgGrad)" />

  <!-- Subtle Internal Border -->
  <rect x="8" y="8" width="496" height="496" rx="120" fill="none" stroke="#FFFFFF" stroke-opacity="0.08" stroke-width="12" />

  <!-- Glowing pulse background effect -->
  <path d="M 96 256 L 192 256 L 224 160 L 256 352 L 288 224 L 320 256 L 416 256" 
        fill="none" stroke="url(#accentGrad)" stroke-width="32" stroke-linecap="round" stroke-linejoin="round" opacity="0.15" filter="url(#glow)" />

  <!-- Main Ballot Box & Check Symbol -->
  <!-- Box Base -->
  <path d="M 128 320 L 128 416 C 128 424.8 135.2 432 144 432 L 368 432 C 376.8 432 384 424.8 384 416 L 384 320" 
        fill="none" stroke="#FFFFFF" stroke-width="28" stroke-linecap="round" stroke-linejoin="round" />
        
  <!-- Box Top / Slot -->
  <path d="M 96 320 L 416 320" 
        fill="none" stroke="#FFFFFF" stroke-width="28" stroke-linecap="round" />
  <rect x="208" y="306" width="96" height="28" rx="8" fill="#0B0B0B" stroke="#FFFFFF" stroke-width="12" />

  <!-- Checked Ballot card slipping in, custom designed as a glowing pulse checkmark -->
  <path d="M 216 112 L 248 144 L 360 32" 
        fill="none" stroke="url(#accentGrad)" stroke-width="36" stroke-linecap="round" stroke-linejoin="round" filter="url(#glow)" />
</svg>